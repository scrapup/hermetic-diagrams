name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write # required for npm provenance (OIDC)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: npm
      - run: npm ci
      # `prepublishOnly` runs build + lint + test + golden before the package is published;
      # a failing golden exfiltration test blocks the release. Provenance is attached via OIDC.
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
