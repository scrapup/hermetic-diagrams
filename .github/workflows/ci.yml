name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast, hermetic gates — no Docker. Runs on the full OS matrix (TF-76-04).
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm run test:coverage

  # Containment proof — integration + golden exfiltration against the real compose stack.
  # Requires Linux containers (Kroki); GitHub-hosted macOS/Windows runners cannot run them,
  # so this job is Linux-only (TF-76-05, plan §7.2).
  containment:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Integration (compose stack, all notations)
        run: npm run test:integration
      - name: Golden exfiltration (zero sink hits)
        run: npm run test:golden

  # Homologation gate (TF-76-03): a digest bump in images.lock may only merge after the
  # containment suites re-prove containment with the new digest. Enforced by `needs: containment`
  # (which ran golden + integration on this ref). This job makes the policy explicit and fails
  # if images.lock changed without the containment job succeeding.
  homologation:
    needs: containment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check images.lock homologation
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          if [ -z "$BASE" ]; then BASE="${{ github.event.before }}"; fi
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE" 2>/dev/null; then
            echo "No comparable base ref; skipping images.lock diff (containment already proven)."
            exit 0
          fi
          if git diff --name-only "$BASE" HEAD | grep -qx 'images.lock'; then
            echo "images.lock changed — containment was re-proven by the 'containment' job (golden + integration)."
          else
            echo "images.lock unchanged."
          fi
