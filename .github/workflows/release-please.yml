name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  id-token: write # required for npm provenance

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # 1. Open/update the Release PR (bumps package.json + plugin.json/marketplace.json +
      #    CHANGELOG) and, once that PR is merged, create the tag and the GitHub Release.
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # The steps below run only when a Release was just created (Release PR merged).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: ${{ steps.release.outputs.release_created }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: ${{ steps.release.outputs.release_created }}
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          cache: npm

      # 2. Publish to npm. `prepublishOnly` (build + lint + test + golden) runs as part of
      #    `npm publish` — never publish with a failing golden exfiltration test (plan.md §7.3).
      #    Requires the Docker daemon for the golden/integration suite; GitHub-hosted ubuntu
      #    runners provide it natively.
      - run: npm ci
        if: ${{ steps.release.outputs.release_created }}

      - run: npm publish
        if: ${{ steps.release.outputs.release_created }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # 3. Publish the built artifact to the orphan `dist` branch, so marketplace installs (Claude
  #    Code, Copilot CLI — TF-78-01, docs/specs/plugin-distribution/) get a ready-to-run plugin
  #    with no manual build step. Runs strictly after `npm publish` has already succeeded — a
  #    failed build/publish never touches `dist`, so the last intact snapshot stays available
  #    (RN-02/RN-04). `dist` matches no `push` trigger in this repo's workflows, so this cannot
  #    loop back into CI.
  publish-dist-branch:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm

      - run: npm ci --ignore-scripts

      - run: npm run build

      - name: Force-push the built snapshot to the dist branch
        env:
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan dist
          git add -A -- . ':!dist' # the tag's tree, minus dist/ (added next with -f below)
          git add -f dist
          git commit -m "chore: dist snapshot for $TAG_NAME"
          git push --force origin dist
