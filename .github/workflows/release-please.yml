name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  id-token: write # required for npm provenance

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # 1. Open/update the Release PR (bumps package.json + plugin.json/marketplace.json +
      #    CHANGELOG) and, once that PR is merged, create the tag and the GitHub Release.
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # The steps below run only when a Release was just created (Release PR merged).
      - uses: actions/checkout@v4
        if: ${{ steps.release.outputs.release_created }}

      - uses: actions/setup-node@v4
        if: ${{ steps.release.outputs.release_created }}
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          cache: npm

      # 2. Publish to npm. `prepublishOnly` (build + lint + test + golden) runs as part of
      #    `npm publish` — never publish with a failing golden exfiltration test (plan.md §7.3).
      #    Requires the Docker daemon for the golden/integration suite; GitHub-hosted ubuntu
      #    runners provide it natively.
      - run: npm ci
        if: ${{ steps.release.outputs.release_created }}

      - run: npm publish
        if: ${{ steps.release.outputs.release_created }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
